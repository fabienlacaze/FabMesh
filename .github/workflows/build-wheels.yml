name: Build custom wheels (Win+CUDA12+Py3.11)

# Builds flash-attn, kaolin and xformers for Windows x64 with CUDA 12.8
# and Python 3.11. Triggers:
#   - workflow_dispatch (manual run from the Actions tab)
#   - on push to master that modifies any of:
#       build/build_wheels.md
#       .github/workflows/build-wheels.yml
#
# Outputs are uploaded as workflow artifacts (~5 GB compressed).
# Once verified, copy them to fabmesh-wheels Cloudflare R2 bucket
# served at https://wheels.fabmesh.com/simple/.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'build/build_wheels.md'
      - '.github/workflows/build-wheels.yml'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      CUDA_VERSION: '12.8.0'
      PY_VERSION: '3.11.9'
      TORCH_VERSION: '2.7.0'
      FLASH_ATTN_VERSION: '2.7.0'
      KAOLIN_VERSION: '0.16.0'
      XFORMERS_VERSION: '0.0.28'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        id: cuda
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      - name: Install MSVC Build Tools (already on windows-2022)
        run: |
          echo "Visual Studio 2022 Build Tools come pre-installed on windows-2022 runners"
          where cl.exe || echo "cl.exe not on PATH yet — will be set by vcvarsall"

      - name: Install base pip tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install ninja cmake packaging

      - name: Install torch + torchvision (cu128)
        shell: bash
        run: |
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cu128 \
            torch==${TORCH_VERSION} torchvision

      - name: Build flash-attn
        shell: bash
        env:
          MAX_JOBS: '2'
          FLASH_ATTENTION_FORCE_BUILD: 'TRUE'
        run: |
          mkdir -p dist
          git clone --depth 1 -b v${FLASH_ATTN_VERSION} \
            https://github.com/Dao-AILab/flash-attention.git
          cd flash-attention
          python -m pip wheel . --no-deps --no-build-isolation -w ../dist
          cd ..

      - name: Build kaolin
        shell: bash
        env:
          IGNORE_TORCH_VER: '1'
          FORCE_CUDA: '1'
        run: |
          git clone --depth 1 -b v${KAOLIN_VERSION} \
            https://github.com/NVIDIAGameWorks/kaolin.git
          cd kaolin
          python -m pip wheel . --no-deps --no-build-isolation -w ../dist
          cd ..

      - name: Build xformers
        shell: bash
        env:
          XFORMERS_FORCE_DISABLE_TRITON: '1'
        run: |
          python -m pip wheel "xformers==${XFORMERS_VERSION}" \
            --no-deps --no-build-isolation -w dist/

      - name: List built wheels
        shell: bash
        run: |
          ls -lh dist/*.whl
          du -sh dist/

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabmesh-wheels-cu128-py311
          path: dist/*.whl
          retention-days: 30
          if-no-files-found: error
