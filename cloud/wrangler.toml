# Cloudflare Workers config for MyFabmesh.AI Cloud.
#
# Build chain (no more @opennextjs/cloudflare — esbuild "Invalid alias name"
# bug blocked it on CI). New flow:
#
#   cloud/$ npm run build                # → ./out/ (next export static HTML)
#   cloud/$ npx wrangler deploy          # → uploads src/worker.ts + ./out
#
# The Worker (src/worker.ts) handles all /api/* and /auth/callback routes,
# everything else is served from the static `out/` directory via
# env.ASSETS.fetch().
#
# Once live: https://myfabmesh-cloud.fabien65400.workers.dev
# Custom domain (optional): https://cloud.myfabmesh.ai

name = "myfabmesh-cloud"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (the `next export` output).
[assets]
directory = "out"
binding = "ASSETS"

# Production R2 bucket binding (uploaded GLBs).
# The bucket name must exist beforehand (already created):
#   myfabmesh-meshes
[[r2_buckets]]
binding = "MESHES"
bucket_name = "myfabmesh-meshes"

# Public (non-secret) runtime vars. The Worker accesses these via
# env.<NAME>; they're also baked into the frontend at build time
# (cloud-deploy.yml). Keeping them in wrangler.toml means they
# follow the repo and never drift.
#
# Sensitive values (Supabase service-role, Stripe secret + webhook
# secret, Replicate token, R2 keys) live in `wrangler secret put`
# and are NOT versioned here.
#
# MODAL FEATURE FLAG (POC — text2image only):
#   wrangler secret put MODAL_TEXT2IMAGE_URL   # paste the URL Modal
#                                              # printed on `modal deploy`
#                                              # (looks like https://<ws>--
#                                              #  myfabmesh-cloud-...-modal.run)
#   wrangler secret put MODAL_SHARED_SECRET    # same 32-byte hex used
#                                              # on Modal via
#                                              # `modal secret create
#                                              #   myfabmesh-shared
#                                              #   SHARED_SECRET=<hex>`
# Rollback to Replicate: `wrangler secret delete MODAL_TEXT2IMAGE_URL`.
###############################################################################
# Pre-warm cron — DISABLED for now.
#
# The naive every-4-min cron was burning credits 24/7 even when no user
# was online. The smart-heartbeat version (only fires if a tab is open)
# is being wired up; once that's deployed, re-enable with:
#   [triggers]
#   crons = ["*/4 * * * *"]
# The scheduled() handler in src/worker.ts already gates on
# isUserOnline() so it will no-op if no /api/heartbeat was received
# in the last 5 minutes. Re-enabling is safe.
###############################################################################
# [triggers]
# crons = ["*/4 * * * *"]

[vars]
MOCK = "0"
NEXT_PUBLIC_MOCK = "0"
NEXT_PUBLIC_SITE_URL = "https://myfabmesh-cloud.fabien65400.workers.dev"
NEXT_PUBLIC_SUPABASE_URL = "https://ovoccoipeqmkfnugkmyh.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92b2Njb2lwZXFta2ZudWdrbXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTIzODgsImV4cCI6MjA5NTE4ODM4OH0.0vjGjN1VD_h_MefS4quDFnGXa-nTsbpM2KpNvQZKQlI"
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = "pk_test_51TEArR3uvj2cFz0krEmYFCk7Pfj3wnWboyu9dwEWxpBSTxelTH6Q80KLLBOjTrxXO4kxbt2Q05TSAt1Y3nUQSdA700OL4r1KcL"
REPLICATE_MODEL = "fishwowater/trellis2"
R2_PUBLIC_URL = "https://pub-ca633fb6a3334d0ea29be5fe5eb47228.r2.dev"

# Hard budget safeguards — the Worker refuses any Replicate call if
# the cumulative daily spend (across ALL users) would exceed
# MAX_DAILY_SPEND_USD, OR if a single user hits MAX_USER_DAILY_CALLS.
# Counters live in R2 (`_meta/spend/<YYYY-MM-DD>` and
# `_meta/userdaily/<userId>/<YYYY-MM-DD>`) and reset at UTC midnight.
# Raise these once we're confident in the cost model — they exist
# precisely to stop another cost runaway like the one on 2026-05-24.
MAX_DAILY_SPEND_USD = "0.50"
# Per-user daily call cap. Bumped from 10 → 100 on 2026-05-25 because
# the 10 ceiling was hit during a normal afternoon of debugging
# (Modal migration POC). Modal is ~5-10× cheaper than Replicate, so a
# higher per-user ceiling now matches a safer dollar exposure than the
# original 10 calls assumed at Replicate rates.
MAX_USER_DAILY_CALLS = "100"
