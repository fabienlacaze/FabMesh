# Cloudflare Workers config for MyFabmesh.AI Cloud (Next.js 15 via OpenNext).
#
# Build chain:
#   cloud/$ npx @opennextjs/cloudflare build
#   -> produces .open-next/ folder
#
# Deploy:
#   cloud/$ npx wrangler deploy
#   -> uploads .open-next/worker.js and assets
#
# In Cloudflare dashboard, the build/deploy commands above are configured
# under the project "myfabmesh-cloud":
#   Build:  cd cloud && npm install --legacy-peer-deps && npx @opennextjs/cloudflare build
#   Deploy: cd cloud && npx wrangler deploy
#
# Once live: https://myfabmesh-cloud.workers.dev
# Custom domain (optional): https://cloud.myfabmesh.ai

name = "myfabmesh-cloud"
main = ".open-next/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Static assets (Next.js public/ + _next/static/) served from KV.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Production R2 bucket binding (uploaded GLBs).
# The bucket name must exist beforehand (already created):
#   myfabmesh-meshes
[[r2_buckets]]
binding = "MESHES"
bucket_name = "myfabmesh-meshes"

