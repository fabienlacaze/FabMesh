# Cloudflare Workers config for MyFabmesh.AI Cloud.
#
# Build chain (no more @opennextjs/cloudflare — esbuild "Invalid alias name"
# bug blocked it on CI). New flow:
#
#   cloud/$ npm run build                # → ./out/ (next export static HTML)
#   cloud/$ npx wrangler deploy          # → uploads src/worker.ts + ./out
#
# The Worker (src/worker.ts) handles all /api/* and /auth/callback routes,
# everything else is served from the static `out/` directory via
# env.ASSETS.fetch().
#
# Once live: https://myfabmesh-cloud.fabien65400.workers.dev
# Custom domain (optional): https://cloud.myfabmesh.ai

name = "myfabmesh-cloud"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (the `next export` output).
[assets]
directory = "out"
binding = "ASSETS"

# Production R2 bucket binding (uploaded GLBs).
# The bucket name must exist beforehand (already created):
#   myfabmesh-meshes
[[r2_buckets]]
binding = "MESHES"
bucket_name = "myfabmesh-meshes"

# Public (non-secret) runtime vars. The Worker accesses these via
# env.<NAME>; they're also baked into the frontend at build time
# (cloud-deploy.yml). Keeping them in wrangler.toml means they
# follow the repo and never drift.
#
# Sensitive values (Supabase service-role, Stripe secret + webhook
# secret, Replicate token, R2 keys) live in `wrangler secret put`
# and are NOT versioned here.
###############################################################################
# Pre-warm cron — keep the Replicate Cog hot.
#
# Without this, our /api/generate-image cold-starts in ~3 min (Replicate
# allocates a GPU + copies the 18 GB image to it). Once the worker is
# warm, predictions take ~10-30 s. Replicate dropps the worker after ~5
# min of inactivity, so we hit it every 4 minutes with a trivial call.
#
# The cron is wired in src/worker.ts's `scheduled()` handler, which
# fires a 1-step text2image at low cost (~$0.02/call) just to keep the
# instance allocated. Off-peak cost: ~$5-9/month for 24/7 warm.
###############################################################################
[triggers]
crons = ["*/4 * * * *"]

[vars]
MOCK = "0"
NEXT_PUBLIC_MOCK = "0"
NEXT_PUBLIC_SITE_URL = "https://myfabmesh-cloud.fabien65400.workers.dev"
