# is added to the frontend (site key) and the token is sent as
# `cf-turnstile-response`. See verifyTurnstile() in src/worker.ts.

# Hard budget safeguards — the Worker refuses any Replicate call if
# the cumulative daily spend (across ALL users) would exceed
# MAX_DAILY_SPEND_USD, OR if a single user hits MAX_USER_DAILY_CALLS.
# Counters live in R2 (`_meta/spend/<YYYY-MM-DD>` and
# `_meta/userdaily/<userId>/<YYYY-MM-DD>`) and reset at UTC midnight.
# Raise these once we're confident in the cost model — they exist
# precisely to stop another cost runaway like the one on 2026-05-24.
# Daily Replicate spend cap. Bumped 0.50 → 5.00 on 2026-05-25 because
# a single mesh = $0.50 (Replicate fishwowater/trellis2) so the $0.50
# cap allowed 1 mesh per day. $5 = ~10 meshes/day, matches expected
# user volume. text2image + back-view live on Modal (own counter at
# MAX_DAILY_MODAL_SPEND_USD), no impact here.
MAX_DAILY_SPEND_USD = "4.00"
# Daily Modal spend cap (GLOBAL, across ALL users). Was bumped to $20/day for
# heavy dev/test; LOWERED to $10/day for commercial launch so a single bad day
# can't run away. Raise again for heavy dev sessions if needed.
MAX_DAILY_MODAL_SPEND_USD = "6.00"
# Per-user daily CALL cap. Was 1000 for heavy dev/test; LOWERED to 100 for
# commercial launch to blunt abuse (a single account can't fire 1000 GPU jobs/
# day). Combined with MAX_USER_DAILY_SPEND_USD below this bounds per-account
# cost. Raise for dev sessions if it gets in the way.
MAX_USER_DAILY_CALLS = "40"
# ANTI-DoS PER-ACCOUNT $ CAP (new). Even with unlimited credits, one account
# can never push more than this much ESTIMATED GPU cost per UTC day across all
# Modal/Replicate endpoints. Counter: `_meta/userspend/<userId>/<YYYY-MM-DD>`.
# $2/day = plenty for legitimate use (~4-40 jobs) while stopping a compromised
# or abusive account from exploding the bill. Default in worker.ts is also $2.
MAX_USER_DAILY_SPEND_USD = "2.00"
#
# NOTE (free signup grant): the initial free-credit grant for a NEW account is
# set in Supabase (DB default / trigger on the profiles table), NOT here. If it
# is currently generous, the USER should lower it in Supabase so a wave of
# throwaway signups can't drain the GPU budget. See userTodo.
