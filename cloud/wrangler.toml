# here. Set it with: openssl rand -hex 32 | npx wrangler secret put R2_URL_SIGNING_SECRET
# REQUIRED IN PRODUCTION: signed URLs are now MANDATORY. When this secret is
# unset (and MOCK=0), signedR2Url() FAILS CLOSED (throws) instead of leaking a
# permanent public r2.dev URL for the private bucket — so the bucket can be made
# private without exposing user face photos / meshes. For LOCAL DEV ONLY you can
# set R2_ALLOW_UNSIGNED="1" to restore the old public-URL fallback; NEVER set
# R2_ALLOW_UNSIGNED in production.
