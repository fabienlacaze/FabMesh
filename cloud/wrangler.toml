# Hard budget safeguards — the Worker refuses any Replicate call if
# the cumulative daily spend (across ALL users) would exceed
# MAX_DAILY_SPEND_USD, OR if a single user hits MAX_USER_DAILY_CALLS.
# Counters live in R2 (`_meta/spend/<YYYY-MM-DD>` and
# `_meta/userdaily/<userId>/<YYYY-MM-DD>`) and reset at UTC midnight.
# Raise these once we're confident in the cost model — they exist
# precisely to stop another cost runaway like the one on 2026-05-24.
# Daily Replicate spend cap. Bumped 0.50 → 5.00 on 2026-05-25 because
# a single mesh = $0.50 (Replicate fishwowater/trellis2) so the $0.50
# cap allowed 1 mesh per day. $5 = ~10 meshes/day, matches expected
# user volume. text2image + back-view live on Modal (own counter at
# MAX_DAILY_MODAL_SPEND_USD), no impact here.
MAX_DAILY_SPEND_USD = "5.00"
# Daily Modal spend cap. Defaults to $2/day in worker.ts; bumped to
# $20/day on 2026-06-01 for heavy dev/test (text2image+meshes+rigs+anims
# all live on Modal at ~$0.05-$0.50 each). Drop back to $2 in prod
# before paying users hit it.
MAX_DAILY_MODAL_SPEND_USD = "20.00"
# Per-user daily call cap. Bumped 10 → 100 (2026-05-25), then
# 100 → 1000 (2026-06-01) because heavy dev/test sessions blow through
# 100 in an afternoon. Modal cost per call is small (~$0.06 image, ~$0.50
# auto-rig) so 1000 calls × $0.50 = $500/user/day MAX is bounded by
# MAX_DAILY_SPEND_USD (currently $5) and MAX_DAILY_MODAL_SPEND_USD anyway
# — the per-user cap is a softer rate-limit, not a budget cap. Drop to
# 200 once we have paying users to limit abuse.
MAX_USER_DAILY_CALLS = "1000"
