# Cloudflare Workers config for MyFabmesh.AI Cloud.
account_id = "a74e8ad01c363d77acec95c7f2123d9a"
#
# Build chain (no more @opennextjs/cloudflare — esbuild "Invalid alias name"
# bug blocked it on CI). New flow:
#
#   cloud/$ npm run build                # → ./out/ (next export static HTML)
#   cloud/$ npx wrangler deploy          # → uploads src/worker.ts + ./out
#
# The Worker (src/worker.ts) handles all /api/* and /auth/callback routes,
# everything else is served from the static `out/` directory via
# env.ASSETS.fetch().
#
# Once live: https://myfabmesh-cloud.fabien65400.workers.dev
# Custom domain (optional): https://cloud.myfabmesh.ai

name = "myfabmesh-cloud"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (the `next export` output).
[assets]
directory = "out"
binding = "ASSETS"

# Production R2 bucket binding (uploaded GLBs).
# The bucket name must exist beforehand (already created):
#   myfabmesh-meshes
[[r2_buckets]]
binding = "MESHES"
bucket_name = "myfabmesh-meshes"

# Public (non-secret) runtime vars. The Worker accesses these via
# env.<NAME>; they're also baked into the frontend at build time
# (cloud-deploy.yml). Keeping them in wrangler.toml means they
# follow the repo and never drift.
#
# Sensitive values (Supabase service-role, Stripe secret + webhook
# secret, Replicate token, R2 keys) live in `wrangler secret put`
# and are NOT versioned here.
#
# MODAL FEATURE FLAG (POC — text2image only):
#   wrangler secret put MODAL_TEXT2IMAGE_URL   # paste the URL Modal
#                                              # printed on `modal deploy`
#                                              # (looks like https://<ws>--
#                                              #  myfabmesh-cloud-...-modal.run)
#   wrangler secret put MODAL_SHARED_SECRET    # same 32-byte hex used
#                                              # on Modal via
#                                              # `modal secret create
#                                              #   myfabmesh-shared
#                                              #   SHARED_SECRET=<hex>`
# Rollback to Replicate: `wrangler secret delete MODAL_TEXT2IMAGE_URL`.
#
# MODAL PUPPETEER RIG (auto-rigging on uploaded GLBs):
#   wrangler secret put MODAL_PUPPETEER_RIG_URL  # paste the URL Modal
#                                                # printed on `modal deploy
#                                                # modal_app/_puppeteer_rig.py`
#                                                # (looks like https://<ws>--
#                                                #  myfabmesh-puppeteer-...-modal.run)
#   # Reuses the same MODAL_SHARED_SECRET as text2image — no extra secret
#   # needed unless you want to isolate the rig endpoint.
# Rollback (disable rig button on the cloud UI):
#   `wrangler secret delete MODAL_PUPPETEER_RIG_URL`.
# See modal_app/PUPPETEER_DEPLOY.md for the full walkthrough.
###############################################################################
# Pre-warm cron — DISABLED for now.
#
# The naive every-4-min cron was burning credits 24/7 even when no user
# was online. The smart-heartbeat version (only fires if a tab is open)
# is being wired up; once that's deployed, re-enable with:
#   [triggers]
#   crons = ["*/4 * * * *"]
# The scheduled() handler in src/worker.ts already gates on
# isUserOnline() so it will no-op if no /api/heartbeat was received
# in the last 5 minutes. Re-enabling is safe.
###############################################################################
# [triggers]
# crons = ["*/4 * * * *"]

# ACTIVE: weekly keep-alive so the free-tier Supabase project never auto-pauses
# (7-day inactivity). scheduled() runs ONLY the cheap Supabase ping for this
# cron — no pre-warm / credit burn. Free (Cloudflare cron is on the free plan).
[triggers]
crons = ["0 6 * * 1"]

