# MyFabmesh.AI Cloud — Cog config for Replicate deployment.
#
# Builds a Docker image that runs our full image-to-3D pipeline:
# auto-rectify, TRELLIS-2 generation, back-view, face inpaint, smooth,
# upscale. Same pipeline as the desktop app, so cloud output matches
# desktop output 1:1.
#
# Build + push:
#   cd cog/
#   cog push r8.im/fabienlacaze/myfabmesh-cloud
#
# GPU SELECTION (cost control):
# Replicate picks the GPU at *deploy time* in the model dashboard,
# not via cog.yaml. After `cog push`, go to:
#   https://replicate.com/fabienlacaze/myfabmesh-cloud/settings
# and set the hardware tier to **Nvidia L40S** ($0.000725/s) instead
# of the default A100 80GB ($0.0014/s) — that's a 48% saving per gen.
# A100 80GB is only needed if a model needs >40 GB VRAM, which TRELLIS-2
# does not (peaks at ~14 GB in 1024 mode, ~22 GB in 1536 cascade).
build:
  # CUDA 12.4 is the highest version Cog CLI v0.14.10 understands.
  # That pairs naturally with torch 2.4.x / cu124 wheels.
  gpu: true
  cuda: "12.4"
  python_version: "3.11"
  python_packages:
    # CUDA-friendly torch from PyTorch's index
    - "torch==2.4.1 --index-url https://download.pytorch.org/whl/cu124"
    - "torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cu124"
    # Core diffusion / 3D libs — pinned tight to versions that work with
    # torch 2.4. transformers 4.47+ requires torch.distributed.tensor.
    # device_mesh which only exists in torch 2.5+ → ModuleNotFoundError
    # at import.
    - "transformers==4.45.2"
    - "diffusers==0.31.0"
    - "huggingface_hub==0.25.2"
    - "accelerate==0.34.2"
    - "safetensors==0.4.5"
    - "xformers==0.0.28"
    # 3D processing
    - "trimesh>=4.4"
    - "pygltflib>=1.16"
    - "pyrender>=0.1.45"
    # Image processing
    - "pillow>=10"
    - "opencv-python>=4.9"
    - "numpy>=1.26,<2.0"
    - "scipy>=1.13"
    # Background removal, captioning, upscaling
    - "rembg>=2.0"
    - "realesrgan>=0.3.0"
    - "basicsr>=1.4"
    # Misc
    - "requests"
    - "tqdm"
  system_packages:
    - "libgl1"
    - "libglib2.0-0"
    - "libsm6"
    - "libxext6"
    - "libxrender-dev"
  run:
    # Pre-download the heavy HF weights INTO the image so the first
    # prediction doesn't pay 87s of setup-time billing on Replicate.
    # We bake the model files into /root/.cache/huggingface/hub so
    # diffusers' from_pretrained finds them locally on cold-start.
    #
    # RealVisXL V4.0 weights (~6.5 GB) — used by every image gen call
    # including back-view. Always-needed → always-baked.
    - python -c "from huggingface_hub import snapshot_download; snapshot_download('SG161222/RealVisXL_V4.0', allow_patterns=['*.safetensors','*.json','*.txt','*.bin'])"
    # ControlNet OpenPose SDXL (~5 GB) — used by back-view.
    - python -c "from huggingface_hub import snapshot_download; snapshot_download('xinsir/controlnet-openpose-sdxl-1.0', allow_patterns=['diffusion_pytorch_model.safetensors','config.json'])"
    # IP-Adapter Plus SDXL (~700 MB) — used by back-view + rectify.
    - python -c "from huggingface_hub import snapshot_download; snapshot_download('h94/IP-Adapter', allow_patterns=['sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors','models/image_encoder/*'])"

predict: "predict.py:Predictor"
