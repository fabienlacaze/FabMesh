<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Paint3D v11</title>
<style>
  html, body { margin:0; padding:0; background:#0d0d0d; color:#ddd; font-family:system-ui, sans-serif; }
  h1 { padding:8px 16px; margin:0; font-size:14px; background:#000; }
  h2 { padding:10px 16px 4px; margin:0; font-size:12px; color:#4ade80; }
  .card { background:#181818; padding:6px; position:relative; }
  .card img { max-width:100%; max-height:500px; object-fit:contain; border:1px solid #333; }
  .card model-viewer { width:100%; height:500px; background:#1b1b1b; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap:2px; background:#000; padding:2px; }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<h1>v11: mv_dir mode + pre-rotate Rx(180) re-enabled</h1>

<h2>init-img-0 (photos mv/)</h2>
<div class="card"><img src="mesh_paint3d_v11.glb.paint3d_work/stage1/init-img-0.png" /></div>

<h2>depth map (mesh droit \u2713)</h2>
<div class="card"><img src="mesh_paint3d_v11.glb.paint3d_work/stage1/init_depth_render.png" /></div>

<h2>albedo final</h2>
<div class="card"><img src="mesh_paint3d_v11.glb.paint3d_work/stage1/res-0/albedo.png" /></div>

<h2>Compare Mesh D vs v11</h2>
<div class="row">
  <div class="card">
    <model-viewer src="mesh_NORMALIZE_1.glb" auto-rotate camera-controls shadow-intensity="1" environment-image="neutral"></model-viewer>
    <p style="font-size:11px;color:#aaa;">Mesh D (baseline)</p>
  </div>
  <div class="card">
    <model-viewer src="mesh_paint3d_v11.glb" auto-rotate camera-controls shadow-intensity="1" environment-image="neutral"></model-viewer>
    <p style="font-size:11px;color:#aaa;">v11 Paint3D mv_dir + pre-rotate</p>
  </div>
</div>
</body>
</html>
