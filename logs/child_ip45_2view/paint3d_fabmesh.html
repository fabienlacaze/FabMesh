<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Paint3D on FabMesh mesh D</title>
<style>
  html, body { margin:0; padding:0; background:#0d0d0d; color:#ddd;
               font-family:system-ui, sans-serif; }
  h1 { padding:8px 16px; margin:0; font-size:14px; background:#000;
       border-bottom:1px solid #333; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:1px;
          background:#000; height:calc(100vh - 80px); padding:4px; }
  .card { background:#181818; padding:8px; position:relative; }
  .card model-viewer { width:100%; height:100%; background:#1b1b1b; }
  .card img { max-width:100%; max-height:100%; object-fit:contain; }
  .label { position:absolute; top:8px; left:16px;
           background:rgba(0,0,0,0.7); padding:5px 10px; font-size:11px;
           color:#eee; border-radius:4px; z-index:5; }
  .thumb { position:absolute; bottom:8px; left:16px; z-index:5; }
  .thumb img { width:100px; border:1px solid #333; }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<h1>Paint3D on FabMesh — mesh D (child ip45) textured via Paint3D stage 1</h1>
<div class="grid">
  <div class="card">
    <div class="label">Original mesh D (texture_project)</div>
    <model-viewer src="mesh_NORMALIZE_1.glb" auto-rotate camera-controls
                  shadow-intensity="1" environment-image="neutral"></model-viewer>
  </div>
  <div class="card" style="border-left:2px solid #4ade80;">
    <div class="label">Paint3D-textured (NEW)</div>
    <model-viewer src="mesh_paint3d.glb" auto-rotate camera-controls
                  shadow-intensity="1" environment-image="neutral"></model-viewer>
  </div>
</div>
</body>
</html>
